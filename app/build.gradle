plugins {
    id "com.android.application"
}

android {
    namespace "com.simplealarm"
    compileSdk 35

    defaultConfig {
        applicationId "com.simplealarm"
        minSdk 26          // Android 8.0
        targetSdk 35       // Android 15
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK is installable by sideloading.
            // Replace with a real keystore before distributing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No dependencies: framework APIs only.
